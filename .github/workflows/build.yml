name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone media dependency (AndroidX Media3 fork)
        run: git clone --depth 1 --branch release https://github.com/idarkalex/media.git ${{ github.workspace }}/../media

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x apk/gradlew

      - name: Build Release APK
        working-directory: apk
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartTwitchTV-release
          path: apk/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Read version info
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: version
        run: |
          VERSION_CODE=$(grep "publishVersionCode:" apk/versions.gradle | grep -o '[0-9]*')
          VERSION_BASE=$(grep "publishVersion:" apk/versions.gradle | sed "s/.*'\(.*\)'.*/\1/")
          APK_NAME="SmartTV_twitch_${VERSION_BASE//./_}_${VERSION_CODE}.apk"
          VERSION_BASE_UNDERSCORE="${VERSION_BASE//./_}"
          TAG_NAME="v${VERSION_CODE}"
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "version_base=${VERSION_BASE}" >> $GITHUB_OUTPUT
          echo "version_base_underscore=${VERSION_BASE_UNDERSCORE}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION_BASE}${VERSION_CODE} (tag: ${TAG_NAME}, apk: ${APK_NAME})"

      - name: Rename APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          cp apk/app/build/outputs/apk/release/app-release.apk \
             "/tmp/${{ steps.version.outputs.apk_name }}"

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ steps.version.outputs.tag_name }}" 2>/dev/null && \
            echo "Release ${{ steps.version.outputs.tag_name }} already exists, skipping" || \
            gh release create "${{ steps.version.outputs.tag_name }}" \
              --repo "${{ github.repository }}" \
              --title "v${{ steps.version.outputs.version_code }}" \
              --generate-notes \
              "/tmp/${{ steps.version.outputs.apk_name }}#SmartTV_twitch_${{ steps.version.outputs.version_base_underscore }}_${{ steps.version.outputs.version_code }}.apk"

      - name: Set up Node.js
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build web assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          npm install -g uglify-js html-minifier crass
          node release/scripts/build.js

      - name: Generate version.json and update ApkUrl
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          APK_URL="https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag_name }}/${{ steps.version.outputs.apk_name }}"
          cat app/general/version.js > /tmp/version_gen.js
          cat release/scripts/version.js >> /tmp/version_gen.js
          node -e "
            eval(require('fs').readFileSync('/tmp/version_gen.js', 'utf8'));
            version.ApkUrl = '${APK_URL}';
            require('fs').writeFileSync('release/githubio/version/version.json', JSON.stringify(version));
            console.log('Updated version.json: ApkUrl=' + version.ApkUrl);
          "
          rm /tmp/version_gen.js

      - name: Deploy web content to release branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          mkdir -p /tmp/webcontent
          cp release/index.html /tmp/webcontent/index.html
          cp release/extrapageindex.html /tmp/webcontent/extrapageindex.html
          cp -r release/githubio /tmp/webcontent/githubio
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan release
          git rm -rf .
          cp -r /tmp/webcontent/* .
          rm -rf /tmp/webcontent
          git add .
          git commit -m "Deploy compiled web content to release branch"
          git push origin release --force
